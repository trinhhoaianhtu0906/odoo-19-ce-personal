[options]
; networking
proxy_mode = True

; workers and throughput
workers = 2
max_cron_threads = 1
gevent_port = 8072
db_maxconn = 8

; high time limits prevent spurious 504 errors
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 629145600
limit_memory_hard = 1677721600
limit_request = 8192

